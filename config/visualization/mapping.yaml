# SLAM and Point Cloud Reconstruction parameters
stereo:
  min_disparity: 0
  num_disparities: 96
  block_size: 5
  p1: 200
  p2: 800
  disp12_max_diff: 1
  pre_filter_cap: 31
  uniqueness_ratio: 10
  speckle_window_size: 100
  speckle_range: 32
  downsample_factor: 2

thermal_projection:
  max_depth_m: 12.0
  min_depth_m: 0.3
  depth_tolerance_m: 0.15 # Visibility z-buffer margin to prevent background bleeding
  bilinear_interpolation: true
  min_valid_temp_c: -20.0
  max_valid_temp_c: 250.0

rtabmap:
  database_path: "~/.ros/rtabmap_dron.db"
  publish_stats: true
  frame_id: "base_link"
  odom_frame_id: "odom"
  map_frame_id: "map"
  subscribe_depth: false
  subscribe_stereo: true
